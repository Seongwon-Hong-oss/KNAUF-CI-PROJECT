name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive function
        env:
          SUPABASE_URL: https://ysawkawnzlozoletuool.supabase.co
          # 공개용(publishable) 키이며 웹 앱 번들에도 포함되어 있다.
          SUPABASE_KEY: sb_publishable_057JioYOrI_tY7MOw9l88A_JfxW0s5V
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
